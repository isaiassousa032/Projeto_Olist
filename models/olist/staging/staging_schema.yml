version: 2

models:

  # ==========================================
  # CUSTOMERS
  # ==========================================
  - name: stg_olist_customers
    description: "Um registro por customer_id."
    columns:
      - name: customer_id
        description: "Identificador do cliente associado ao pedido."
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: "Identificador do comprador, que pode aparecer em vários pedidos."
        data_tests:
          - not_null

      - name: zip_code
        description: "Prefixo de CEP do cadastro associado ao pedido."

      - name: city
        description: "Cidade do cadastro associado ao pedido."

      - name: state
        description: "UF do cadastro associado ao pedido."

  # ==========================================
  # GEOLOCATION
  # ==========================================
  - name: stg_olist_geolocation
    description: "Registros de geolocalização por prefixo de CEP."
    columns:
      - name: zip_code_prefix
        description: "Prefixo do CEP. Pode aparecer em múltiplos registros."
        data_tests:
          - not_null

      - name: latitude
        description: "Coordenada geográfica de latitude."

      - name: longitude
        description: "Coordenada geográfica de longitude."

      - name: city
        description: "Cidade do registro geográfico."

      - name: state
        description: "UF do registro geográfico."

  # ==========================================
  # ORDER ITEMS
  # ==========================================
  - name: stg_olist_order_items
    description: "Um registro por item de pedido."
    columns:
      - name: order_id
        description: "Identificador do pedido."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_orders')
                field: order_id

      - name: order_item_id
        description: "Número sequencial do item dentro do pedido."
        data_tests:
          - not_null

      - name: product_id
        description: "Identificador do produto."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_products')
                field: product_id

      - name: seller_id
        description: "Identificador do vendedor."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_sellers')
                field: seller_id

      - name: shipping_limit_date
        description: "Prazo de envio do item."

      - name: item_price
        description: "Preço do item sem frete."

      - name: freight_price
        description: "Valor do frete do item."

  # ==========================================
  # ORDER PAYMENTS
  # ==========================================
  - name: stg_olist_order_payments
    description: "Um registro por pagamento de um pedido."
    columns:
      - name: order_id
        description: "Identificador do pedido."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_orders')
                field: order_id

      - name: payment_sequential
        description: "Sequência do pagamento dentro do pedido."
        data_tests:
          - not_null

      - name: payment_type
        description: "Modalidade utilizada no pagamento."

      - name: installments_count
        description: "Quantidade de parcelas informada no pagamento."

      - name: payment_amount
        description: "Valor do pagamento."

  # ==========================================
  # ORDER REVIEWS
  # ==========================================
  - name: stg_olist_order_reviews
    description: "Registros das avaliações dos pedidos."
    columns:
      - name: review_id
        description: "Identificador da avaliação."
        data_tests:
          - not_null

      - name: order_id
        description: "Identificador do pedido avaliado."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_orders')
                field: order_id

      - name: rating
        description: "Nota atribuída ao pedido, de 1 a 5."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

      - name: comment_title
        description: "Título do comentário, quando informado."

      - name: comment_message
        description: "Texto do comentário, quando informado."

      - name: review_created_at
        description: "Data de criação da avaliação."

      - name: review_answered_at
        description: "Data da resposta à avaliação, quando disponível."

  # ==========================================
  # ORDERS
  # ==========================================
  - name: stg_olist_orders
    description: "Um registro por pedido."
    columns:
      - name: order_id
        description: "Identificador único do pedido."
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: "Identificador do cliente associado ao pedido."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist_customers')
                field: customer_id
      - name: status
        description: "Status atual do pedido."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - delivered
                  - invoiced
                  - shipped
                  - canceled
                  - unavailable
                  - processing
                  - created
                  - approved

      - name: purchased_at
        description: "Data e hora da compra."

      - name: approved_at
        description: "Data e hora da aprovação, quando disponível."

      - name: delivered_to_carrier_at
        description: "Data e hora da entrega à transportadora, quando disponível."

      - name: delivered_to_customer_at
        description: "Data e hora da entrega ao cliente, quando disponível."

      - name: estimated_delivery_at
        description: "Data estimada para a entrega."

  # ==========================================
  # PRODUCT CATEGORY TRANSLATION
  # ==========================================
  - name: stg_olist_product_category_name_translation
    description: "Tradução das categorias de produtos."
    columns:
      - name: category_name_pt
        description: "Categoria original em português."
        data_tests:
          - unique
          - not_null

      - name: category_name_en
        description: "Categoria traduzida para inglês."

  # ==========================================
  # PRODUCTS
  # ==========================================
  - name: stg_olist_products
    description: "Um registro por produto."
    columns:
      - name: product_id
        description: "Identificador único do produto."
        data_tests:
          - unique
          - not_null

      - name: category_name_pt
        description: "Categoria original do produto."

      - name: name_length
        description: "Comprimento do nome do produto."

      - name: description_length
        description: "Comprimento da descrição do produto."

      - name: photos_count
        description: "Quantidade de fotos do produto."

      - name: weight_g
        description: "Peso do produto em gramas."

      - name: length_cm
        description: "Comprimento do produto em centímetros."

      - name: height_cm
        description: "Altura do produto em centímetros."

      - name: width_cm
        description: "Largura do produto em centímetros."

  # ==========================================
  # SELLERS
  # ==========================================
  - name: stg_olist_sellers
    description: "Um registro por vendedor."
    columns:
      - name: seller_id
        description: "Identificador único do vendedor."
        data_tests:
          - unique
          - not_null

      - name: zip_code_prefix
        description: "Prefixo do CEP do vendedor."

      - name: city
        description: "Cidade do vendedor."

      - name: state
        description: "UF do vendedor."
